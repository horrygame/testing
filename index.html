<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Программирование Робота</title>
    <style>
        /* Все предыдущие стили остаются без изменений */
        /* Добавляем новые стили для мастерской */

        .workshop-container {
            width: 90%;
            max-width: 1200px;
            height: 70vh;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .workshop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .workshop-controls {
            display: flex;
            gap: 15px;
        }

        .workshop-content {
            display: flex;
            gap: 20px;
            flex: 1;
            height: 100%;
        }

        .levels-list {
            flex: 1;
            background: rgba(93, 64, 55, 0.8);
            border-radius: 5px;
            padding: 15px;
            overflow-y: auto;
            border: 2px solid #8d6e63;
            max-height: 500px;
        }

        .level-item {
            background: rgba(121, 85, 72, 0.7);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            cursor: pointer;
            border: 1px solid #8d6e63;
            transition: all 0.3s;
        }

        .level-item:hover {
            background: rgba(141, 110, 99, 0.8);
            transform: translateY(-2px);
        }

        .level-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .level-item-title {
            font-size: 18px;
            font-weight: bold;
            color: #ffd54f;
        }

        .level-item-author {
            font-size: 14px;
            color: #bcaaa4;
        }

        .level-item-description {
            font-size: 14px;
            color: #f5e8c8;
            margin-bottom: 8px;
        }

        .level-item-stats {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: #d7ccc8;
        }

        .editor-container {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .editor-tools {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: rgba(93, 64, 55, 0.8);
            border-radius: 5px;
            border: 2px solid #8d6e63;
        }

        .editor-tool {
            width: 60px;
            height: 60px;
            background: rgba(121, 85, 72, 0.7);
            border: 2px solid #8d6e63;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: grab;
            transition: all 0.3s;
            text-align: center;
            font-size: 12px;
            color: #f5e8c8;
        }

        .editor-tool:hover {
            background: rgba(141, 110, 99, 0.8);
            transform: translateY(-2px);
        }

        .editor-tool img {
            width: 32px;
            height: 32px;
            margin-bottom: 5px;
        }

        .editor-canvas-container {
            flex: 1;
            background: rgba(93, 64, 55, 0.8);
            border-radius: 5px;
            border: 2px solid #8d6e63;
            position: relative;
            overflow: hidden;
        }

        #editor-canvas {
            width: 100%;
            height: 100%;
        }

        .editor-properties {
            background: rgba(93, 64, 55, 0.8);
            padding: 15px;
            border-radius: 5px;
            border: 2px solid #8d6e63;
        }

        .property-group {
            margin-bottom: 15px;
        }

        .property-group label {
            display: block;
            margin-bottom: 5px;
            color: #f5e8c8;
            font-weight: bold;
        }

        .property-group input,
        .property-group textarea {
            width: 100%;
            padding: 8px;
            background: rgba(121, 85, 72, 0.7);
            border: 1px solid #8d6e63;
            border-radius: 3px;
            color: #f5e8c8;
        }

        .property-group textarea {
            height: 80px;
            resize: vertical;
        }

        .empty-message {
            text-align: center;
            color: #bcaaa4;
            font-style: italic;
            padding: 40px;
        }

        .delete-level-btn {
            background: #ef5350 !important;
            padding: 5px 10px !important;
            font-size: 12px !important;
            height: auto !important;
            min-width: auto !important;
        }

        .delete-level-btn:hover {
            background: #f44336 !important;
        }

        /* Стили для иконки мастерской */
        .hammer-icon {
            position: absolute;
            width: 48px;
            height: 48px;
            transition: transform 0.5s ease, opacity 0.5s ease;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .hammer-normal {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23f5e8c8"><path d="M2 2v2h4v2H4v2h2v2H2v2h4v2H2v2h4v4h2v-4h2v4h2v-4h2v4h2v-4h2v-2h-2v-2h2V8h-2V6h2V2h-2v2h-2V2h-2v2h-2V2H2zm14 4v2h-2V6h2zm-4 0v2h-2V6h2zm4 4v2h-2v-2h2zm-4 0v2h-2v-2h2z"/></svg>');
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        .hammer-active {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ffd54f"><path d="M2 2v2h4v2H4v2h2v2H2v2h4v2H2v2h4v4h2v-4h2v4h2v-4h2v4h2v-4h2v-2h-2v-2h2V8h-2V6h2V2h-2v2h-2V2h-2v2h-2V2H2zm14 4v2h-2V6h2zm-4 0v2h-2V6h2zm4 4v2h-2v-2h2zm-4 0v2h-2v-2h2z"/></svg>');
            opacity: 0;
            transform: scale(0.8) rotate(-15deg);
        }

        #workshop-btn:hover .hammer-normal {
            opacity: 0;
            transform: scale(0.8) rotate(15deg);
        }

        #workshop-btn:hover .hammer-active {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        .static-hammer {
            width: 40px;
            height: 40px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ffd54f"><path d="M2 2v2h4v2H4v2h2v2H2v2h4v2H2v2h4v4h2v-4h2v4h2v-4h2v4h2v-4h2v-2h-2v-2h2V8h-2V6h2V2h-2v2h-2V2h-2v2h-2V2H2zm14 4v2h-2V6h2zm-4 0v2h-2V6h2zm4 4v2h-2v-2h2zm-4 0v2h-2v-2h2z"/></svg>') no-repeat center center;
            background-size: contain;
        }
    </style>
</head>
<body>
    <!-- Анимация загрузки (без изменений) -->
    <div id="loading-container">
        <!-- ... существующий код загрузки ... -->
    </div>

    <!-- Основная игра -->
    <div id="game-container" class="medieval-border">
        <canvas id="game-canvas"></canvas>
        
        <!-- Главное меню -->
        <div id="main-menu" class="screen">
            <div class="title-container">
                <h1>Программирование Робота
                    <div class="castle-icon"></div>
                </h1>
            </div>
            <p class="parchment">Программируйте робота для выполнения заданий на различных уровнях</p>
            
            <div class="menu-buttons">
                <button class="button" id="levels-btn">
                    <div class="icon-container">
                        <div class="lock-icon lock-closed"></div>
                        <div class="lock-icon lock-open"></div>
                    </div>
                    Уровни
                </button>
                <button class="button" id="tutorial-btn">
                    <div class="icon-container">
                        <div class="book-icon book-closed"></div>
                        <div class="book-icon book-open"></div>
                    </div>
                    Пособие
                </button>
                <!-- НОВАЯ КНОПКА МАСТЕРСКОЙ -->
                <button class="button" id="workshop-btn">
                    <div class="icon-container">
                        <div class="hammer-icon hammer-normal"></div>
                        <div class="hammer-icon hammer-active"></div>
                    </div>
                    Мастерская
                </button>
            </div>
        </div>
        
        <!-- Экран уровней (без изменений) -->
        <div id="levels-screen" class="screen hidden">
            <!-- ... существующий код уровней ... -->
        </div>
        
        <!-- Экран пособия (без изменений) -->
        <div id="tutorial-screen" class="screen hidden">
            <!-- ... существующий код пособия ... -->
        </div>

        <!-- НОВЫЙ ЭКРАН МАСТЕРСКОЙ -->
        <div id="workshop-screen" class="screen hidden">
            <h2>
                <span class="static-icon static-hammer"></span>
                Мастерская уровней
            </h2>
            <p class="parchment">Создавайте и играйте в пользовательские уровни</p>
            
            <button class="button" id="workshop-back-btn">← Назад</button>
            
            <div class="workshop-container">
                <div class="workshop-header">
                    <h3>Пользовательские уровни</h3>
                    <div class="workshop-controls">
                        <button class="button" id="create-level-btn">Создать уровень</button>
                        <button class="button" id="import-level-btn">Импорт уровня</button>
                        <button class="button" id="export-level-btn">Экспорт уровня</button>
                    </div>
                </div>
                
                <div class="workshop-content">
                    <div class="levels-list" id="custom-levels-list">
                        <!-- Список пользовательских уровней будет здесь -->
                        <div class="empty-message" id="empty-levels-message">
                            Пока нет созданных уровней. Нажмите "Создать уровень" чтобы начать!
                        </div>
                    </div>
                    
                    <div class="editor-container" id="editor-container" style="display: none;">
                        <div class="editor-tools">
                            <div class="editor-tool" draggable="true" data-type="robot">
                                <img src="white_guy.png" alt="Робот">
                                <span>Робот</span>
                            </div>
                            <div class="editor-tool" draggable="true" data-type="enemy">
                                <img src="red_guy.png" alt="Враг">
                                <span>Враг</span>
                            </div>
                            <div class="editor-tool" draggable="true" data-type="target">
                                <div style="width:32px;height:32px;background:#4caf50;border:2px solid white;"></div>
                                <span>Цель</span>
                            </div>
                            <div class="editor-tool" draggable="true" data-type="obstacle">
                                <img src="wall.png" alt="Стена">
                                <span>Стена</span>
                            </div>
                            <div class="editor-tool" draggable="true" data-type="erase">
                                <div style="width:32px;height:32px;background:#ef5350;display:flex;align-items:center;justify-content:center;color:white;font-size:20px;">×</div>
                                <span>Удалить</span>
                            </div>
                        </div>
                        
                        <div class="editor-canvas-container">
                            <canvas id="editor-canvas"></canvas>
                        </div>
                        
                        <div class="editor-properties">
                            <div class="property-group">
                                <label for="level-title">Название уровня:</label>
                                <input type="text" id="level-title" placeholder="Введите название уровня">
                            </div>
                            <div class="property-group">
                                <label for="level-description">Описание:</label>
                                <textarea id="level-description" placeholder="Опишите задание уровня"></textarea>
                            </div>
                            <div class="property-group">
                                <label for="level-author">Автор:</label>
                                <input type="text" id="level-author" placeholder="Ваше имя">
                            </div>
                            <div class="workshop-controls">
                                <button class="button" id="save-level-btn">Сохранить уровень</button>
                                <button class="button" id="test-level-btn">Тестировать уровень</button>
                                <button class="button" id="cancel-edit-btn">Отмена</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Остальные экраны (без изменений) -->
        <!-- ... существующий код ... -->
    </div>

    <script>
        // ========== РАСШИРЕНИЕ ОСНОВНОЙ ИГРЫ ==========
        
        // Добавляем состояние для мастерской
        gameState.workshop = {
            customLevels: [],
            currentEditLevel: null,
            editMode: false,
            selectedTool: null,
            grid: Array(GRID_HEIGHT).fill().map(() => Array(GRID_WIDTH).fill(null))
        };

        // Получаем новые элементы DOM для мастерской
        const workshopScreen = document.getElementById('workshop-screen');
        const workshopBtn = document.getElementById('workshop-btn');
        const workshopBackBtn = document.getElementById('workshop-back-btn');
        const createLevelBtn = document.getElementById('create-level-btn');
        const importLevelBtn = document.getElementById('import-level-btn');
        const exportLevelBtn = document.getElementById('export-level-btn');
        const customLevelsList = document.getElementById('custom-levels-list');
        const emptyLevelsMessage = document.getElementById('empty-levels-message');
        const editorContainer = document.getElementById('editor-container');
        const editorCanvas = document.getElementById('editor-canvas');
        const editorCtx = editorCanvas.getContext('2d');
        const levelTitleInput = document.getElementById('level-title');
        const levelDescriptionInput = document.getElementById('level-description');
        const levelAuthorInput = document.getElementById('level-author');
        const saveLevelBtn = document.getElementById('save-level-btn');
        const testLevelBtn = document.getElementById('test-level-btn');
        const cancelEditBtn = document.getElementById('cancel-edit-btn');

        // Регистрируем мастерскую как экран
        screens.workshop = workshopScreen;

        // Добавляем обработчики для мастерской
        function setupWorkshop() {
            // Кнопки навигации
            workshopBtn.addEventListener('click', () => showScreen('workshop'));
            workshopBackBtn.addEventListener('click', () => showScreen('main_menu'));
            
            // Кнопки управления мастерской
            createLevelBtn.addEventListener('click', createNewLevel);
            importLevelBtn.addEventListener('click', importLevel);
            exportLevelBtn.addEventListener('click', exportLevel);
            
            // Кнопки редактора
            saveLevelBtn.addEventListener('click', saveLevel);
            testLevelBtn.addEventListener('click', testLevel);
            cancelEditBtn.addEventListener('click', cancelEdit);
            
            // Настройка перетаскивания инструментов
            setupEditorTools();
            
            // Настройка canvas редактора
            setupEditorCanvas();
            
            // Загрузка пользовательских уровней из localStorage
            loadCustomLevels();
        }

        // Настройка инструментов редактора
        function setupEditorTools() {
            const tools = document.querySelectorAll('.editor-tool');
            
            tools.forEach(tool => {
                tool.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', tool.getAttribute('data-type'));
                });
            });
        }

        // Настройка canvas редактора
        function setupEditorCanvas() {
            // Установка размера canvas
            function resizeEditorCanvas() {
                const container = editorCanvas.parentElement;
                editorCanvas.width = container.clientWidth;
                editorCanvas.height = container.clientHeight;
                renderEditor();
            }
            
            window.addEventListener('resize', resizeEditorCanvas);
            resizeEditorCanvas();
            
            // Обработчики событий для редактора
            editorCanvas.addEventListener('dragover', (e) => {
                e.preventDefault();
            });
            
            editorCanvas.addEventListener('drop', (e) => {
                e.preventDefault();
                const toolType = e.dataTransfer.getData('text/plain');
                const rect = editorCanvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                // Преобразование координат в клетки сетки
                const gridX = Math.floor(x / (editorCanvas.width / GRID_WIDTH));
                const gridY = Math.floor(y / (editorCanvas.height / GRID_HEIGHT));
                
                placeObject(gridX, gridY, toolType);
            });
            
            editorCanvas.addEventListener('click', (e) => {
                if (gameState.workshop.selectedTool) {
                    const rect = editorCanvas.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    const gridX = Math.floor(x / (editorCanvas.width / GRID_WIDTH));
                    const gridY = Math.floor(y / (editorCanvas.height / GRID_HEIGHT));
                    
                    placeObject(gridX, gridY, gameState.workshop.selectedTool);
                }
            });
            
            // Выбор инструмента при клике
            const tools = document.querySelectorAll('.editor-tool');
            tools.forEach(tool => {
                tool.addEventListener('click', () => {
                    tools.forEach(t => t.style.borderColor = '#8d6e63');
                    tool.style.borderColor = '#ffd54f';
                    gameState.workshop.selectedTool = tool.getAttribute('data-type');
                });
            });
        }

        // Размещение объекта на сетке
        function placeObject(x, y, type) {
            if (x < 0 || x >= GRID_WIDTH || y < 0 || y >= GRID_HEIGHT) return;
            
            const grid = gameState.workshop.grid;
            
            // Проверка для робота - может быть только один
            if (type === 'robot') {
                // Удаляем существующего робота
                for (let i = 0; i < GRID_HEIGHT; i++) {
                    for (let j = 0; j < GRID_WIDTH; j++) {
                        if (grid[i][j] === 'robot') {
                            grid[i][j] = null;
                        }
                    }
                }
            }
            
            // Удаление объекта
            if (type === 'erase') {
                grid[y][x] = null;
            } else {
                grid[y][x] = type;
            }
            
            renderEditor();
        }

        // Рендер редактора
        function renderEditor() {
            const width = editorCanvas.width;
            const height = editorCanvas.height;
            const cellWidth = width / GRID_WIDTH;
            const cellHeight = height / GRID_HEIGHT;
            
            // Очистка canvas
            editorCtx.fillStyle = '#5d4037';
            editorCtx.fillRect(0, 0, width, height);
            
            // Отрисовка сетки
            editorCtx.strokeStyle = 'rgba(141, 110, 99, 0.3)';
            editorCtx.lineWidth = 1;
            
            for (let x = 0; x <= GRID_WIDTH; x++) {
                editorCtx.beginPath();
                editorCtx.moveTo(x * cellWidth, 0);
                editorCtx.lineTo(x * cellWidth, height);
                editorCtx.stroke();
            }
            
            for (let y = 0; y <= GRID_HEIGHT; y++) {
                editorCtx.beginPath();
                editorCtx.moveTo(0, y * cellHeight);
                editorCtx.lineTo(width, y * cellHeight);
                editorCtx.stroke();
            }
            
            // Отрисовка объектов
            const grid = gameState.workshop.grid;
            for (let y = 0; y < GRID_HEIGHT; y++) {
                for (let x = 0; x < GRID_WIDTH; x++) {
                    const type = grid[y][x];
                    if (type) {
                        const screenX = x * cellWidth;
                        const screenY = y * cellHeight;
                        
                        switch (type) {
                            case 'robot':
                                editorCtx.fillStyle = '#f5e8c8';
                                editorCtx.fillRect(screenX, screenY, cellWidth, cellHeight);
                                editorCtx.strokeStyle = '#fff';
                                editorCtx.lineWidth = 2;
                                editorCtx.strokeRect(screenX, screenY, cellWidth, cellHeight);
                                break;
                            case 'enemy':
                                editorCtx.fillStyle = '#ef5350';
                                editorCtx.fillRect(screenX, screenY, cellWidth, cellHeight);
                                break;
                            case 'target':
                                editorCtx.fillStyle = '#4caf50';
                                editorCtx.fillRect(screenX, screenY, cellWidth, cellHeight);
                                editorCtx.strokeStyle = '#fff';
                                editorCtx.lineWidth = 2;
                                editorCtx.strokeRect(screenX, screenY, cellWidth, cellHeight);
                                break;
                            case 'obstacle':
                                editorCtx.fillStyle = '#6d4c41';
                                editorCtx.fillRect(screenX, screenY, cellWidth, cellHeight);
                                break;
                        }
                    }
                }
            }
        }

        // Создание нового уровня
        function createNewLevel() {
            // Сброс сетки
            gameState.workshop.grid = Array(GRID_HEIGHT).fill().map(() => Array(GRID_WIDTH).fill(null));
            
            // Сброс формы
            levelTitleInput.value = '';
            levelDescriptionInput.value = '';
            levelAuthorInput.value = '';
            
            // Показать редактор
            editorContainer.style.display = 'flex';
            customLevelsList.style.display = 'none';
            emptyLevelsMessage.style.display = 'none';
            
            gameState.workshop.editMode = true;
            gameState.workshop.currentEditLevel = null;
            
            renderEditor();
        }

        // Загрузка пользовательских уровней
        function loadCustomLevels() {
            const savedLevels = localStorage.getItem('robotProgrammingCustomLevels');
            if (savedLevels) {
                gameState.workshop.customLevels = JSON.parse(savedLevels);
                renderCustomLevelsList();
            }
        }

        // Сохранение пользовательских уровней
        function saveCustomLevels() {
            localStorage.setItem('robotProgrammingCustomLevels', JSON.stringify(gameState.workshop.customLevels));
        }

        // Рендер списка пользовательских уровней
        function renderCustomLevelsList() {
            customLevelsList.innerHTML = '';
            
            if (gameState.workshop.customLevels.length === 0) {
                emptyLevelsMessage.style.display = 'block';
                return;
            }
            
            emptyLevelsMessage.style.display = 'none';
            
            gameState.workshop.customLevels.forEach((level, index) => {
                const levelItem = document.createElement('div');
                levelItem.className = 'level-item';
                levelItem.innerHTML = `
                    <div class="level-item-header">
                        <div class="level-item-title">${level.title}</div>
                        <div class="level-item-author">by ${level.author}</div>
                    </div>
                    <div class="level-item-description">${level.description}</div>
                    <div class="level-item-stats">
                        <span>Сложность: ${level.difficulty || 'Не указана'}</span>
                        <span>Объектов: ${countObjects(level)}</span>
                    </div>
                    <div style="margin-top: 10px; display: flex; gap: 10px;">
                        <button class="button" style="padding: 5px 10px; font-size: 12px; height: auto;" data-play="${level.id}">Играть</button>
                        <button class="button" style="padding: 5px 10px; font-size: 12px; height: auto;" data-edit="${level.id}">Редактировать</button>
                        <button class="button delete-level-btn" data-delete="${level.id}">Удалить</button>
                    </div>
                `;
                
                customLevelsList.appendChild(levelItem);
            });
            
            // Добавляем обработчики для кнопок
            document.querySelectorAll('[data-play]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const levelId = e.target.getAttribute('data-play');
                    playCustomLevel(levelId);
                });
            });
            
            document.querySelectorAll('[data-edit]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const levelId = e.target.getAttribute('data-edit');
                    editCustomLevel(levelId);
                });
            });
            
            document.querySelectorAll('[data-delete]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const levelId = e.target.getAttribute('data-delete');
                    deleteCustomLevel(levelId);
                });
            });
        }

        // Подсчет объектов в уровне
        function countObjects(level) {
            let count = 0;
            count += level.obstacles ? level.obstacles.length : 0;
            count += level.enemies ? level.enemies.length : 0;
            count += level.robot ? 1 : 0;
            count += level.target ? 1 : 0;
            return count;
        }

        // Играть в пользовательский уровень
        function playCustomLevel(levelId) {
            const level = gameState.workshop.customLevels.find(l => l.id === levelId);
            if (level) {
                // Добавляем уровень в общий список уровней временно
                const customLevelIndex = gameState.levels.length;
                gameState.levels.push({
                    ...level,
                    program: [],
                    completed: false,
                    unlocked: true,
                    isCustom: true
                });
                
                startLevel(customLevelIndex);
            }
        }

        // Редактирование пользовательского уровня
        function editCustomLevel(levelId) {
            const level = gameState.workshop.customLevels.find(l => l.id === levelId);
            if (level) {
                // Заполняем форму
                levelTitleInput.value = level.title;
                levelDescriptionInput.value = level.description;
                levelAuthorInput.value = level.author;
                
                // Загружаем сетку
                gameState.workshop.grid = Array(GRID_HEIGHT).fill().map(() => Array(GRID_WIDTH).fill(null));
                
                // Размещаем объекты на сетке
                if (level.robot) {
                    gameState.workshop.grid[level.robot.y][level.robot.x] = 'robot';
                }
                
                if (level.target) {
                    gameState.workshop.grid[level.target.y][level.target.x] = 'target';
                }
                
                level.enemies.forEach(enemy => {
                    gameState.workshop.grid[enemy.y][enemy.x] = 'enemy';
                });
                
                level.obstacles.forEach(obstacle => {
                    gameState.workshop.grid[obstacle.y][obstacle.x] = 'obstacle';
                });
                
                // Показать редактор
                editorContainer.style.display = 'flex';
                customLevelsList.style.display = 'none';
                
                gameState.workshop.editMode = true;
                gameState.workshop.currentEditLevel = levelId;
                
                renderEditor();
            }
        }

        // Удаление пользовательского уровня
        function deleteCustomLevel(levelId) {
            if (confirm('Вы уверены, что хотите удалить этот уровень?')) {
                gameState.workshop.customLevels = gameState.workshop.customLevels.filter(l => l.id !== levelId);
                saveCustomLevels();
                renderCustomLevelsList();
            }
        }

        // Сохранение уровня
        function saveLevel() {
            const title = levelTitleInput.value.trim();
            const description = levelDescriptionInput.value.trim();
            const author = levelAuthorInput.value.trim();
            
            if (!title) {
                alert('Пожалуйста, введите название уровня');
                return;
            }
            
            if (!author) {
                alert('Пожалуйста, введите имя автора');
                return;
            }
            
            // Собираем объекты из сетки
            const robot = findObject('robot');
            const target = findObject('target');
            const enemies = findAllObjects('enemy');
            const obstacles = findAllObjects('obstacle');
            
            if (!robot) {
                alert('На уровне должен быть робот!');
                return;
            }
            
            if (!target) {
                alert('На уровне должна быть цель!');
                return;
            }
            
            const levelData = {
                id: gameState.workshop.currentEditLevel || generateId(),
                title,
                description,
                author,
                robot,
                target,
                enemies,
                obstacles,
                createdAt: new Date().toISOString(),
                difficulty: calculateDifficulty(enemies.length, obstacles.length)
            };
            
            if (gameState.workshop.currentEditLevel) {
                // Обновление существующего уровня
                const index = gameState.workshop.customLevels.findIndex(l => l.id === gameState.workshop.currentEditLevel);
                if (index !== -1) {
                    gameState.workshop.customLevels[index] = levelData;
                }
            } else {
                // Добавление нового уровня
                gameState.workshop.customLevels.push(levelData);
            }
            
            saveCustomLevels();
            cancelEdit();
            renderCustomLevelsList();
        }

        // Поиск объекта на сетке
        function findObject(type) {
            for (let y = 0; y < GRID_HEIGHT; y++) {
                for (let x = 0; x < GRID_WIDTH; x++) {
                    if (gameState.workshop.grid[y][x] === type) {
                        return {x, y};
                    }
                }
            }
            return null;
        }

        // Поиск всех объектов определенного типа
        function findAllObjects(type) {
            const objects = [];
            for (let y = 0; y < GRID_HEIGHT; y++) {
                for (let x = 0; x < GRID_WIDTH; x++) {
                    if (gameState.workshop.grid[y][x] === type) {
                        objects.push({x, y});
                    }
                }
            }
            return objects;
        }

        // Генерация ID
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        // Расчет сложности уровня
        function calculateDifficulty(enemies, obstacles) {
            const total = enemies + obstacles;
            if (total < 3) return 'Легкий';
            if (total < 6) return 'Средний';
            if (total < 10) return 'Сложный';
            return 'Эксперт';
        }

        // Тестирование уровня
        function testLevel() {
            const robot = findObject('robot');
            const target = findObject('target');
            const enemies = findAllObjects('enemy');
            const obstacles = findAllObjects('obstacle');
            
            if (!robot || !target) {
                alert('Для тестирования уровня нужны робот и цель!');
                return;
            }
            
            // Создаем временный уровень для тестирования
            const testLevel = {
                title: 'Тестовый уровень',
                description: 'Тестирование созданного уровня',
                robot,
                target,
                enemies,
                obstacles,
                program: [],
                completed: false,
                unlocked: true,
                isCustom: true
            };
            
            // Добавляем в общий список и запускаем
            const testLevelIndex = gameState.levels.length;
            gameState.levels.push(testLevel);
            startLevel(testLevelIndex);
        }

        // Отмена редактирования
        function cancelEdit() {
            editorContainer.style.display = 'none';
            customLevelsList.style.display = 'block';
            gameState.workshop.editMode = false;
            gameState.workshop.currentEditLevel = null;
            
            // Показываем сообщение если уровней нет
            if (gameState.workshop.customLevels.length === 0) {
                emptyLevelsMessage.style.display = 'block';
            }
        }

        // Импорт уровня
        function importLevel() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                
                reader.onload = event => {
                    try {
                        const levelData = JSON.parse(event.target.result);
                        
                        // Валидация данных уровня
                        if (!levelData.robot || !levelData.target) {
                            alert('Некорректный файл уровня: отсутствуют робот или цель');
                            return;
                        }
                        
                        // Добавляем уровень
                        levelData.id = generateId();
                        levelData.createdAt = new Date().toISOString();
                        gameState.workshop.customLevels.push(levelData);
                        saveCustomLevels();
                        renderCustomLevelsList();
                        
                        alert('Уровень успешно импортирован!');
                    } catch (error) {
                        alert('Ошибка при чтении файла: ' + error.message);
                    }
                };
                
                reader.readAsText(file);
            };
            
            input.click();
        }

        // Экспорт уровня
        function exportLevel() {
            if (!gameState.workshop.currentEditLevel) {
                alert('Сначала создайте или откройте уровень для редактирования');
                return;
            }
            
            const level = gameState.workshop.customLevels.find(l => l.id === gameState.workshop.currentEditLevel);
            if (!level) {
                alert('Уровень не найден');
                return;
            }
            
            // Создаем копию без служебных полей
            const exportData = {
                title: level.title,
                description: level.description,
                author: level.author,
                robot: level.robot,
                target: level.target,
                enemies: level.enemies,
                obstacles: level.obstacles,
                difficulty: level.difficulty
            };
            
            const dataStr = JSON.stringify(exportData, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `robot_level_${level.title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // Обновляем функцию initGame для включения мастерской
        function initGame() {
            // Настройка кнопок
            setupButtons();
            
            // Настройка мастерской
            setupWorkshop();
            
            // Остальная существующая инициализация...
            setupDragAndDrop();
            window.addEventListener('resize', handleResize);
            handleResize();
            gameLoop();
        }

        // Обновляем функцию showScreen для мастерской
        function showScreen(screenName) {
            // Существующий код...
            
            // Дополнительная логика для мастерской
            if (screenName === 'workshop') {
                renderCustomLevelsList();
            }
            
            // Остальной существующий код...
        }

        // Пример структуры level.json:
        /*
        {
            "title": "Мой первый уровень",
            "description": "Простой уровень для обучения",
            "author": "Игрок",

            "target": {"x": 7, "y": 4},
            "enemies": [
                {"x": 4, "y": 4}
            ],

                {"x": 3, "y": 3},
                {"x": 3, "y": 4},
                {"x": 3, "y": 5}
            ],
            "difficulty": "Средний"
        }
        */
    </script>
</body>
